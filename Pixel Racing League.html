<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Racing League</title><meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--bg:#14121f;--pn:#1f1b33;--ln:#3a3361;--tx:#eee9ff;--mu:#9a93c4;--ac:#ffcf33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;padding:12px;max-width:1000px;margin:auto}
h1{font-size:20px;color:var(--ac);margin:4px 0 10px;letter-spacing:1px}h2{font-size:15px;margin:14px 0 6px;color:var(--ac)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button,select,input[type=text]{font:inherit;background:var(--pn);color:var(--tx);border:2px solid var(--ln);padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#111;border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}
.card{background:var(--pn);border:2px solid var(--ln);padding:10px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu)}
canvas{image-rendering:pixelated;width:100%;max-width:960px;background:#2d6a3a;border:2px solid var(--ln);display:block}
.av{height:44px;width:auto;image-rendering:pixelated;vertical-align:middle}.pv{image-rendering:pixelated;display:block;margin:8px auto;max-width:100%}
.st{display:grid;grid-template-columns:90px 1fr 20px;gap:4px;font-size:12px;align-items:center}
.st input{width:100%}table{border-collapse:collapse;width:100%}td,th{padding:4px 6px;border-bottom:1px solid var(--ln);text-align:left}
.heat{display:inline-block;vertical-align:top;margin:4px;min-width:200px}.win{color:var(--ac)}
.big{font-size:18px;color:var(--ac)}.wrap{overflow-x:auto}
</style></head><body>
<h1>▀▄ PIXEL RACING LEAGUE ▄▀</h1>
<div id="clk" class="card" style="margin:6px 0"><div class="row" id="clkr" style="gap:12px"></div><div id="clkp"></div></div>
<nav id="nav"></nav><div id="view"></div>
<script>
const $=s=>document.querySelector(s);
const KEYS=[['top','Top speed'],['acc','Acceleration'],['hnd','Handling'],['rea','Reaction'],['ovt','Overtaking'],['con','Consistency']];
let db={players:[],tournaments:[],races:{}};
try{const x=localStorage.getItem('prl1');if(x)db=JSON.parse(x)}catch(e){}
function save(){try{localStorage.setItem('prl1',JSON.stringify(db))}catch(e){}}
const uid=()=>Math.random().toString(36).slice(2,9);
const P=id=>db.players.find(p=>p.id==id);
let tab='players',cur=null;
// ---- track geometry
let A=140,R=50,CX=160,CY=100,H=A/2,ARC=Math.PI*R,PER=2*A+2*ARC,LAPS=3,TOTAL=LAPS*PER;const OP=PER;
function posOval(s,d){s=((s%OP)+OP)%OP;let t;
 if(s<A)return{x:CX-H+s,y:CY+R+d,a:0,c:0};s-=A;
 if(s<ARC){const f=Math.PI/2-s/R;return{x:CX+H+(R+d)*Math.cos(f),y:CY+(R+d)*Math.sin(f),a:f-Math.PI/2,c:1}}s-=ARC;
 if(s<A)return{x:CX+H-s,y:CY-R-d,a:Math.PI,c:0};s-=A;
 const f=-Math.PI/2-s/R;return{x:CX-H+(R+d)*Math.cos(f),y:CY+(R+d)*Math.sin(f),a:f-Math.PI/2,c:1}}
let OBS=[{s:110,d:-6},{s:260,d:6},{s:380,d:-5},{s:500,d:4}];
// ---- simulation (single stepping function used for live, fast-forward and skip)
function rngf(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function newSim(ids,seed){return{ids,seed,rng:rngf(seed),t:0,tick:0,done:false,frames:[],order:[],
 cars:ids.map((id,i)=>({id,s:-i*0+0,v:0,d:(i-1.5)*6,td:(i-1.5)*6,tmr:Math.random()*0+i*.1,noise:0,fin:null,cd:0,maxv:0,start:-i*7}))}}
// grid start: cars staggered behind line
function initGrid(sim){sim.cars.forEach((c,i)=>{c.s=-i*9;})}
function stepSim(sim,dt){if(sim.done)return;const r=sim.rng;sim.t+=dt;sim.tick++;
 for(const c of sim.cars){const p=P(c.id).st;
  if(c.fin!=null){c.v=Math.max(0,c.v-40*dt);c.s+=c.v*dt;continue}
  c.noise+=-c.noise*dt*.8+(r()-.5)*.12*(11-p.con)/10;c.noise=Math.max(-.15,Math.min(.15,c.noise));
  let tgt=(45+p.top*3.2)*(1+c.noise);const ps=pos(c.s,c.d);if(ps.c)tgt*=Math.min(1,.55+p.hnd*.05);
  c.tmr-=dt;
  if(c.tmr<=0){c.tmr=Math.max(.15,.9-p.rea*.07+r()*.2);let hz=false;
   for(const o of OBS){const gap=((o.s-c.s)%PER+PER)%PER;if(gap<48&&Math.abs(c.d-o.d)<9){c.td=o.d>0?-11:o.d<0?11:(r()<.5?-11:11);hz=true;break}}
   if(!hz)for(const o of sim.cars){if(o===c||o.fin!=null)continue;const g=o.s-c.s;
    if(g>0&&g<28&&Math.abs(o.d-c.d)<9&&o.v<c.v+4){if(r()<.1+p.ovt*.09){c.td=o.d>=0?-10:10}}}
   if(!hz&&r()<.15)c.td=Math.max(-11,Math.min(11,c.td+(r()-.5)*8))}
  const ms=(14+p.hnd*3)*dt;c.d+=Math.max(-ms,Math.min(ms,c.td-c.d));
  for(const o of sim.cars){if(o===c||o.fin!=null)continue;const g=o.s-c.s;if(g>0&&g<13&&Math.abs(o.d-c.d)<7)tgt=Math.min(tgt,o.v)}
  c.cd-=dt;if(c.cd<=0)for(const o of OBS){const g=((o.s-c.s)%PER+PER)%PER;if((g<4||g>PER-3)&&Math.abs(c.d-o.d)<6){c.v*=.45;c.cd=1.5;break}}
  const up=(12+p.acc*4)*dt;c.v+=Math.max(-60*dt,Math.min(up,tgt-c.v));c.v=Math.max(0,c.v);c.maxv=Math.max(c.maxv,c.v);
  c.s+=c.v*dt;if(c.s>=TOTAL){c.fin=sim.t-(c.s-TOTAL)/Math.max(c.v,1)}}
 if(sim.tick%2==0)sim.frames.push(sim.cars.map(c=>[Math.round(c.s*10),Math.round(c.d*10),Math.round(c.v)]));
 if(sim.cars.every(c=>c.fin!=null)||sim.t>150){sim.done=true;sim.order=rank(sim).map(c=>c.id)}}
function rank(sim){return[...sim.cars].sort((a,b)=>(a.fin!=null&&b.fin!=null)?a.fin-b.fin:a.fin!=null?-1:b.fin!=null?1:b.s-a.s)}
// ---- results + tournament logic (idempotent)
function roundName(n,total){const left=total-n;return left==0?'Final':n==total-1?'Semi-finals':'Round '+(n+1)}
function mkRound(t,ids){const heats=[];for(let i=0;i<ids.length;i+=4)heats.push({ids:ids.slice(i,i+4),res:null});t.rounds.push({heats})}
function finalizeRace(rid,sim,t,ri,hi){if(db.races[rid])return;
 const order=sim.order,fin={};sim.cars.forEach(c=>fin[c.id]=c.fin);
 db.races[rid]={id:rid,ids:sim.ids,order,fin,maxv:Object.fromEntries(sim.cars.map(c=>[c.id,Math.round(c.maxv)])),time:+sim.t.toFixed(1),frames:sim.frames,tn:t.name};
 order.forEach((id,i)=>{const s=P(id).rec;s.races++;if(i==0)s.wins++;else s.losses++;if(i<3)s.pod++;s.pts+=[5,3,2,1][i];});
 t.rounds[ri].heats[hi].res=order.slice();
 const rd=t.rounds[ri];if(rd.heats.every(h=>h.res)){
  if(rd.heats.length==1){t.status='done';t.champion=order[0];t.final=order.slice();P(order[0]).rec.titles++;order.forEach((id,i)=>{P(id).rec.best=Math.min(P(id).rec.best||9,i+1)})}
  else mkRound(t,rd.heats.flatMap(h=>h.res.slice(0,2)))}
 const keys=Object.keys(db.races);if(keys.length>40)delete db.races[keys[0]];save()}
function nextHeat(t){for(let r=0;r<t.rounds.length;r++)for(let h=0;h<t.rounds[r].heats.length;h++)if(!t.rounds[r].heats[h].res)return[r,h];return null}
function runFast(t,r,h){const rid=t.id+'-'+r+'-'+h;const sim=newSim(t.rounds[r].heats[h].ids,Math.floor(Math.random()*2**31));initGrid(sim);
 while(!sim.done)stepSim(sim,1/30);finalizeRace(rid,sim,t,r,h)}
// ---- UI
function nav(){$('#nav').innerHTML=[['players','Racers'],['tour','Tournaments'],['race','Race'],['board','Leaderboard']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(t){stopLoop();tab=t;render()}
function render(){nav();({players:vPlayers,tour:vTour,race:vRace,board:vBoard})[tab]()}
function av(p){return p.img?`<img class="av" src="${p.img}">`:`<span class="av" style="display:inline-block;background:${p.color}"></span>`}
function vPlayers(){$('#view').innerHTML=`<div class="card"><h2>Register racer</h2><div class="row"><input type="text" id="pn" placeholder="Name" maxlength="16">
<label>Car <input type="color" id="pc" value="#e63946"></label><label>Image <input type="file" id="pf" accept="image/*"></label><button onclick="addP()">Register</button></div>
<div class="mu">Stats default to balanced (5/10). Adjust them any time on the racer card.</div></div>
<div class="grid">${db.players.map(p=>`<div class="card"><div class="row">${av(p)}<b>${esc(p.name)}</b><span style="background:${p.color};width:22px;height:12px;display:inline-block"></span><button onclick="delP('${p.id}')" style="margin-left:auto">✕</button></div>
<div class="st" style="margin-top:6px">${KEYS.map(([k,l])=>`<span>${l}</span><input type="range" min="1" max="10" value="${p.st[k]}" onchange="P('${p.id}').st.${k}=+this.value;save();this.nextElementSibling.textContent=this.value"><span>${p.st[k]}</span>`).join('')}</div></div>`).join('')||'<p class="mu">No racers yet.</p>'}</div>`}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function addP(){const name=$('#pn').value.trim();if(!name)return alert('Enter a name');
 const p={id:uid(),name,color:$('#pc').value,img:null,st:{top:5,acc:5,hnd:5,rea:5,ovt:5,con:5},rec:{races:0,wins:0,losses:0,pod:0,pts:0,titles:0,best:0}};
 const f=$('#pf').files[0];const done=()=>{db.players.push(p);save();render()};
 if(!f)return done();const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=48;c.getContext('2d').drawImage(im,0,0,48,48);p.img=c.toDataURL('image/png');done()};im.onerror=done;im.src=URL.createObjectURL(f)}
function delP(id){if(db.tournaments.some(t=>t.status!='done'&&t.players.includes(id)))return alert('Racer is in an active tournament.');if(confirm('Delete racer?')){db.players=db.players.filter(p=>p.id!=id);save();render()}}
let sel=new Set();
function vTour(){const n=sel.size,ok=[4,8,16,32].includes(n);
 $('#view').innerHTML=`<div class="card"><h2>Create tournament</h2><input type="text" id="tn" placeholder="Tournament name" maxlength="30">
<p class="mu">Select 4, 8, 16 or 32 racers. Heats of 4; top two advance each round.</p>
<div class="row">${db.players.map(p=>`<label class="row" style="gap:4px"><input type="checkbox" ${sel.has(p.id)?'checked':''} onchange="tg('${p.id}',this.checked)">${av(p)}${esc(p.name)}</label>`).join('')||'<span class="mu">Register racers first.</span>'}</div>
<p>Selected: ${n} ${ok?'✔':'(need 4, 8, 16 or 32)'}</p><button ${ok?'':'disabled'} onclick="mkT()">Create</button></div>
${[...db.tournaments].reverse().map(t=>tview(t)).join('')}`}
function tg(id,v){v?sel.add(id):sel.delete(id);vTour()}
function mkT(){const ids=[...sel];const t={id:uid(),name:$('#tn').value.trim()||'Tournament '+(db.tournaments.length+1),players:ids,rounds:[],status:'live',champion:null};
 const sh=[...ids].sort(()=>Math.random()-.5);mkRound(t,sh);db.tournaments.push(t);sel=new Set();save();render()}
function tview(t){const nh=nextHeat(t);const tot=Math.log2(t.players.length/4)+1;
 return`<div class="card"><div class="row"><b class="big">${esc(t.name)}</b><span class="mu">${t.status=='done'?'Completed':'In progress'} · ${(TRACKS[t.track||'oval']||OVAL).name} · ${t.laps||3} laps</span>
${t.status=='done'?`<span class="win">🏆 ${esc(P(t.champion)?.name||'?')}</span>`:`<button onclick="watch('${t.id}',${nh[0]},${nh[1]})">▶ Watch next heat</button><button onclick="skip('${t.id}')">⏭ Simulate next heat</button><button onclick="skipAll('${t.id}')">⏩ Simulate all</button>`}
<button onclick="delT('${t.id}')" style="margin-left:auto">✕</button></div>
<div class="wrap">${t.rounds.map((r,ri)=>`<h2>${roundName(ri,tot-1)}</h2>${r.heats.map((h,hi)=>`<div class="card heat"><div class="mu">Heat ${hi+1}</div>${(h.res||h.ids).map((id,i)=>`<div class="${h.res&&i<2?'win':''}">${h.res?(i+1)+'. ':''}${esc(P(id)?.name||'?')}${h.res&&i>=2&&t.rounds[ri+1]?' <span class="mu">✖ out</span>':''}${h.res&&!t.rounds[ri+1]&&i==0?' 🏆':''}</div>`).join('')}
${h.res?`<button onclick="rep('${t.id}-${ri}-${hi}')">Replay</button>`:''}</div>`).join('')}`).join('')}</div></div>`}
function delT(id){if(confirm('Delete tournament?')){db.tournaments=db.tournaments.filter(t=>t.id!=id);save();vTour()}}
function skip(id){const t=db.tournaments.find(x=>x.id==id),n=nextHeat(t);if(n)runFast(t,n[0],n[1]);vTour()}
function skipAll(id){const t=db.tournaments.find(x=>x.id==id);let n;while((n=nextHeat(t)))runFast(t,n[0],n[1]);vTour()}
// ---- race view
let run=null,raf=0,speed=1;
function stopLoop(){cancelAnimationFrame(raf);run=null}
function watch(tid,r,h){const t=db.tournaments.find(x=>x.id==tid);const rid=tid+'-'+r+'-'+h;
 if(db.races[rid])return rep(rid);
 const sim=newSim(t.rounds[r].heats[h].ids,Math.floor(Math.random()*2**31));initGrid(sim);
 cur={mode:'live',tid,r,h,rid,sim,cd:3.99,paused:false,saved:false};tab='race';speed=1;render()}
function rep(rid){const rc=db.races[rid];if(!rc)return;cur={mode:'replay',rid,rc,i:0,paused:false};tab='race';speed=1;render()}
function vRace(){if(!cur){$('#view').innerHTML='<div class="card">No race selected. Open a tournament and press “Watch next heat”.</div>';return}
 $('#view').innerHTML=`<div class="card"><div class="row"><b id="rt"></b></div></div><canvas id="cv" width="${TR.W}" height="${TR.H}" style="${TR.H>TR.W?'width:auto;height:78vh;max-width:100%':''}"></canvas>
<div class="row" style="margin:8px 0"><button id="bp">⏸ Pause</button><button data-s="1" class="sp on">1x</button><button data-s="4" class="sp">Fast 4x</button><button data-s="10" class="sp">10x</button>
${cur.mode=='live'?'<button id="bs">⏭ Skip to result</button>':'<button id="br">↺ Restart replay</button>'}</div><div id="hud" class="card"></div><div id="res"></div>`;
 $('#bp').onclick=()=>{cur.paused=!cur.paused;$('#bp').textContent=cur.paused?'▶ Resume':'⏸ Pause'};
 document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('on',x==b))});
 if($('#bs'))$('#bs').onclick=()=>{cur.cd=0;if(!cur.paid&&!econBeginLive(cur))return;if(cur.void)return;while(!cur.sim.done)stepSim(cur.sim,1/30);finish();};
 if($('#br'))$('#br').onclick=()=>{cur.i=0;cur.paused=false;$('#res').innerHTML=''};
 let last=performance.now(),acc=0;
 const loop=now=>{raf=requestAnimationFrame(loop);const dt=Math.min(.1,(now-last)/1000);last=now;if(cur.paused){draw();return}
  if(cur.mode=='live'){if(cur.cd>0)cur.cd-=dt;else if(!cur.paid&&!econBeginLive(cur)){}else{acc+=dt*speed;while(acc>=1/30&&!cur.sim.done){stepSim(cur.sim,1/30);acc-=1/30}if(cur.sim.done&&!cur.saved)finish()}}
  else{cur.i+=dt*speed*15;const n=cur.rc.frames.length;if(cur.i>=n){cur.i=n-1;if(!cur.shown){cur.shown=1;showRes(cur.rc)}}}
  draw()};raf=requestAnimationFrame(loop)}
function finish(){const c=cur;if(c.saved)return;c.saved=true;const t=db.tournaments.find(x=>x.id==c.tid);finalizeRace(c.rid,c.sim,t,c.r,c.h);showRes(db.races[c.rid])}
function showRes(rc){$('#res').innerHTML=`<div class="card"><h2>Official results – ${rc.time}s</h2><table><tr><th>#</th><th>Racer</th><th>Time</th><th>Top speed</th></tr>${rc.order.map((id,i)=>`<tr class="${i<2?'win':''}"><td>${i+1}</td><td>${esc(P(id)?.name||'?')}</td><td>${rc.fin[id]!=null?rc.fin[id].toFixed(2)+'s':'DNF'}</td><td>${rc.maxv[id]}</td></tr>`).join('')}</table><p class="mu">Top two advance. Results saved.</p></div>`}
function state(){if(cur.mode=='live')return cur.sim.cars.map(c=>({id:c.id,s:c.s,d:c.d,v:c.v,fin:c.fin}));
 const f=cur.rc.frames[Math.floor(cur.i)];return cur.rc.ids.map((id,k)=>({id,s:f[k][0]/10,d:f[k][1]/10,v:f[k][2],fin:cur.rc.fin[id]!=null&&f[k][0]/10>=TOTAL?1:null}))}
const imgs={};function img(p){if(!p.img)return null;if(!imgs[p.id]){const i=new Image();i.src=p.img;imgs[p.id]=i}return imgs[p.id]}
function draw(){const cv=$('#cv');if(!cv||!cur)return;const x=cv.getContext('2d');x.imageSmoothingEnabled=false;
 if(TR.id!='oval')x.drawImage(trackBG(),0,0);else{x.fillStyle='#2d6a3a';x.fillRect(0,0,320,200);
 const path=()=>{x.beginPath();x.arc(CX+H,CY,R,-Math.PI/2,Math.PI/2);x.arc(CX-H,CY,R,Math.PI/2,-Math.PI/2);x.closePath()};
 x.lineJoin='round';path();x.strokeStyle='#444';x.lineWidth=30;x.stroke();x.setLineDash([4,4]);x.strokeStyle='#777';x.lineWidth=1;x.stroke();x.setLineDash([]);
 x.fillStyle='#fff';for(let i=0;i<4;i++){x.fillRect(CX-H+(i%2)*2,CY+R-15+i*8,2,4)}}
 for(const o of OBS){const q=pos(o.s,o.d);x.fillStyle='#111';x.fillRect(q.x-3,q.y-2,6,4)}
 const st=state(),ord=cur.mode=='live'?rank(cur.sim).map(c=>c.id):cur.rc.ids.slice().sort((a,b)=>st.find(z=>z.id==b).s-st.find(z=>z.id==a).s);
 for(const c of st){const p=P(c.id),q=pos(c.s,c.d);x.save();x.translate(Math.round(q.x),Math.round(q.y));x.rotate(q.a);x.rotate(Math.PI/2);{const cs=carSprite(p);x.drawImage(cs,-4.5,-4.5*cs.height/cs.width,9,9*cs.height/cs.width)}x.restore();
  {const cs=chSprite(p),hh=Math.round(cs.height*.5);x.drawImage(cs,0,0,cs.width,hh,Math.round(q.x)-7,Math.round(q.y)-17,14,Math.round(14*hh/cs.width))}}
 let tm=cur.mode=='live'?cur.sim.t:cur.i/15;
 if(cur.mode=='live'&&cur.cd>0){x.fillStyle='#ffcf33';x.font='bold 40px monospace';x.textAlign='center';x.fillText(Math.ceil(cur.cd-.0)>3?'3':String(Math.ceil(cur.cd)),TR.W/2,TR.H/2+8);x.textAlign='left';x.font='10px monospace'}
 if(cur.mode=='live'&&cur.cd<=0&&cur.sim.t<.8){x.fillStyle='#ffcf33';x.font='bold 28px monospace';x.textAlign='center';x.fillText('GO!',TR.W/2,TR.H/2+8);x.textAlign='left'}
 $('#rt').textContent=(cur.mode=='live'?'LIVE':'REPLAY')+'  ⏱ '+tm.toFixed(1)+'s | Lap '+Math.min(LAPS,Math.floor(Math.max(0,...st.map(z=>z.s))/PER)+1)+' / '+LAPS+' | '+TR.name+'  '+(cur.mode=='live'&&cur.sim.done?'FINISHED':'');
 $('#hud').innerHTML=ord.map((id,i)=>{const c=st.find(z=>z.id==id),lap=Math.min(LAPS,Math.max(1,Math.floor(Math.max(0,c.s)/PER)+1));
  return`<div class="row" style="gap:8px">${i+1}. ${av(P(id))}<b style="min-width:110px">${esc(P(id).name)}</b><span>Lap ${c.fin!=null?'✔':lap+'/'+LAPS}</span><span>${Math.round(c.v)} px/s</span><span class="mu">${Math.min(100,Math.max(0,c.s/TOTAL*100)).toFixed(0)}%</span></div>`}).join('')}
function vBoard(){const ps=[...db.players].sort((a,b)=>b.rec.titles-a.rec.titles||b.rec.pts-a.rec.pts||b.rec.wins-a.rec.wins);
 $('#view').innerHTML=`<div class="card wrap"><h2>Career leaderboard</h2><table><tr><th>#</th><th>Racer</th><th>🏆</th><th>Pts</th><th>Races</th><th>Wins</th><th>Losses</th><th>Podiums</th><th>Win %</th><th>Best finish (tourn.)</th></tr>

const IDX='0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
let PARTS={ch:[['hair','Hair'],['skin','Skin'],['top','Top / shirt'],['bottom','Bottom'],['shoes','Shoes']],car:[['main','Body'],['accent','Accent / stripe'],['trim','Trim'],['glass','Windows / details']]};
function lum(h){const[r,g,b]=hx(h);return .299*r+.587*g+.114*b}
function recol(c,pt,s,ov){const nb=ov&&ov[pt];if(!nb||pt=='o'||!s.base[pt])return c;const bl=Math.max(20,lum(s.base[pt])),ra=lum(c)/bl;return ra<=1?mixc(nb,'#000000',1-Math.max(0,ra)):mixc(nb,'#ffffff',Math.min(.7,(ra-1)*.9))}
function mk(kind,idx,ov){const s=SPR[kind][idx],k=kind+idx+JSON.stringify(ov||{});if(sc[k])return sc[k];const cv=document.createElement('canvas');cv.width=s.w;cv.height=s.h;const x=cv.getContext('2d');
 const pc=s.pal.map(([c,pt])=>recol(c,pt,s,ov));s.rows.forEach((r,y)=>{for(let i=0;i<s.w;i++){const a=r[2*i];if(a=='.')continue;x.fillStyle=pc[IDX.indexOf(a)*62+IDX.indexOf(r[2*i+1])];x.fillRect(i,y,1,1)}});return sc[k]=cv}
function chSprite(p){return mk('ch',p.chs,p.cho)}
function carSprite(p){return mk('car',p.cars,p.caro)}
const ri=n=>Math.floor(Math.random()*n);
function initV3(p){if(p.chs==null){p.chs=ri(49);p.cho={}}if(p.cars==null){p.cars=ri(20);p.caro={}}}

function addP(){const name=$('#pn').value.trim();if(!name)return alert('Enter a name');if(db.players.some(p=>p.name.toLowerCase()==name.toLowerCase()))return alert('Name already used');
 const p={id:uid(),name,st:{top:5,acc:5,hnd:5,rea:5,ovt:5,con:5},rec:{races:0,wins:0,losses:0,pod:0,pts:0,titles:0,best:0}};initV3(p);db.players.push(p);save();garId=p.id;go('garage')}
const KR=k=>k=='ch'?['chs','cho']:['cars','caro'];
function curCol(kind,pt){const p=P(garId),[i,o]=KR(kind);return p[o][pt]||SPR[kind][p[i]].base[pt]||'#888888'}
function pickS(kind,i){const[a,o]=KR(kind);P(garId)[a]=i;P(garId)[o]={};save();vGarage()}
function setC(kind,pt,v){v=v.trim();if(v[0]!='#')v='#'+v;if(!/^#[0-9a-f]{6}$/i.test(v)){alert('Use a hex color like #ff8800');return vGarage()}P(garId)[KR(kind)[1]][pt]=v.toLowerCase();save();vGarage()}
function rstC(kind,pt){delete P(garId)[KR(kind)[1]][pt];save();vGarage()}
function rstAll(kind){P(garId)[KR(kind)[1]]={};save();vGarage()}
function rnd(kind){const p=P(garId),[a,o]=KR(kind);p[a]=ri(SPR[kind].length);p[o]={};save();vGarage()}
function rndCols(kind){const p=P(garId),o=KR(kind)[1];p[o]={};PARTS[kind].forEach(([pt])=>{if(SPR[kind][p[KR(kind)[0]]].base[pt])p[o][pt]=pick(COLS.concat(HAIRS))});save();vGarage()}
function gcard(kind,title,sc,tsc){const p=P(garId),[a,o]=KR(kind),cv=mk(kind,p[a],p[o]);
 return`<div class="card"><h2>${title}</h2><img class="pv" src="${url(cv,sc)}">
<div class="row" style="margin:6px 0"><button onclick="rnd('${kind}')">\ud83c\udfb2 Random design</button><button onclick="rndCols('${kind}')">\ud83c\udfa8 Random colours</button><button onclick="rstAll('${kind}')">Reset colours</button></div>
${PARTS[kind].filter(([pt])=>SPR[kind][p[a]].base[pt]).map(([pt,l])=>{const v=curCol(kind,pt);return`<div class="row"><span style="width:110px">${l}</span><input type="color" value="${v}" onchange="setC('${kind}','${pt}',this.value)"><input type="text" value="${v}" size="8" maxlength="7" onchange="setC('${kind}','${pt}',this.value)"><button onclick="rstC('${kind}','${pt}')" title="Reset part">\u21ba</button></div>`}).join('')}
<h2>Preset designs</h2><div class="row" style="gap:3px">${SPR[kind].map((_,i)=>`<img src="${url(mk(kind,i,{}),tsc)}" onclick="pickS('${kind}',${i})" style="image-rendering:pixelated;cursor:pointer;padding:2px;border:2px solid ${i==p[a]?'var(--ac)':'transparent'}">`).join('')}</div></div>`}
function vGarage(){if(!db.players.length){$('#view').innerHTML='<div class="card">Register a racer first.</div>';return}
 if(!P(garId))garId=db.players[0].id;const p=P(garId),r=p.rec;
 $('#view').innerHTML=`<div class="card row"><select onchange="garId=this.value;vGarage()">${db.players.map(q=>`<option value="${q.id}" ${q.id==garId?'selected':''}>${esc(q.name)}</option>`).join('')}</select><span class="mu">${r.races} races \u00b7 ${r.wins} wins \u00b7 ${r.pod} podiums \u00b7 ${r.titles} titles</span></div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">${gcard('ch','Character',8,2)}${gcard('car','Car',8,3)}</div>`}

function aiPick(p){const s=S(),q=p.pers,order=[...db.players].sort(LBS.rank[1]);

  if(hh.n)sc+=Math.min(hh.n,5)*.15*(.5+q.rivalrous*.1);if(lost&&s.rematch){sc+=1+q.rivalrous*.25;why='Rematch request'}
  if(d>0){sc+=d*(.15+q.ambitious*.05+q.confident*.04);why=why||'Testing a stronger racer'}if(ro<0)sc+=q.competitive*.05;

  if(db.chal.some(c=>((c.from==p.id&&c.to==o.id)||(c.from==o.id&&c.to==p.id))&&db.day-c.day<=s.cool))sc-=2;return{o,sc:Math.max(.02,sc),why:why||'Seeking a race'}});

function aiRespond(c){const s=S(),o=P(c.to),f=P(c.from);if(!o||!f)return;const q=o.pers,d=f.lv-o.lv,hh=h2h(o.id,f.id);
 let pr=.5+q.confident*.03+q.competitive*.03-q.reserved*.02+(hh.n>=2?q.rivalrous*.03:0)-Math.max(0,d)*q.cautious*.03-(d<-2?.1:0)+(d>0?q.ambitious*.02:0);pr=Math.max(.1,Math.min(.95,pr));

 if(s.counter&&Math.random()<.3){const ks=Object.keys(TRACKS),tr=ks[(ks.indexOf(c.track)+1)%ks.length];return chalAct(c.id,'counter',{track:tr,laps:Math.max(1,Math.min(10,c.laps+(c.laps>3?-1:1)))})}

function econBeginT(t){if(!t||t.econV!=1)return'';EC();if(db.econ.t[t.id])return'';const e=econCheckF(t.players,eco().F8);if(e)return e;
 const f=fundList(t.players,eco().F8,'entry_fee',t.id),r=post(f.list);if(r.err)return r.err;db.econ.t[t.id]={status:'open',ents:f.ents,d:db.day};note(`Entry fees paid for tournament "${t.name}".`,'tourn');return''}
function econRefundBook(book,rid,why){if(!book||book.status!='open')return;const list=[];book.ents.forEach(n=>{if(n.fee>0)list.push({o:'p',id:n.id,type:'refund',amt:n.fee,rid,key:'rf:'+rid+':'+n.id});if(n.co)list.push({o:'c',id:n.co,type:'refund',amt:n.cofee,rid,who:n.id,key:'rfc:'+rid+':'+n.id})});
 const r=post(list);if(!r.err||r.dup){book.status='refunded';note(`Entry fees refunded (${why}).`,'race')}}
const econRefund=(rid,why)=>econRefundBook(EC().races[rid],rid,why),econRefundT=(tid,why)=>econRefundBook(EC().t[tid],tid,why);
function econAbandon(){if(cur&&cur.paid&&!cur.saved&&cur.rid&&!cur.tid)econRefund(cur.rid,'race interrupted')}
function econRecover(){EC();Object.keys(db.econ.races).forEach(rid=>{const e=db.econ.races[rid];if(e.status=='open'&&!db.races[rid]&&!(cur&&cur.rid==rid))econRefund(rid,'interrupted before a result')})}
// ---- settlement (runs exactly once per race)
function winnerOf(rc){return rc.order[0]}
function econSettle(rid,rc){const e=EC().races[rid];if(!e||e.status!='open')return;const list=[],ec=eco(),order=rc.order,ent=id=>e.ents.find(n=>n.id==id);
 if(e.kind=='1v1'){const w=e.wager,[a,b]=rc.ids,draw=(rc.fin[a]==null&&rc.fin[b]==null)||rc.fin[a]==rc.fin[b];
  if(w>0){if(draw){e.ents.forEach(n=>list.push({o:'p',id:n.id,type:'refund',amt:w,rid,key:'dr:'+rid+':'+n.id}));e.draw=true}else{const win=order[0],lose=order[1];list.push({o:'p',id:win,type:'wager_win',amt:2*w,rid,key:'ww:'+rid+':'+win});P(win).wst.wagerWon+=w;P(lose).wst.wagerLost+=w}}}
 else{order.forEach((id,i)=>{const pz=ec.P4[i]||0;if(pz>0)list.push({o:'p',id,type:'prize',amt:pz,rid,key:'pz:'+rid+':'+id})})}
 const w1=ent(order[0]);if(w1&&w1.co&&!e.draw){list.push({o:'c',id:w1.co,type:'victory_reward',amt:ec.CR,rid,who:order[0],key:'vr:'+rid+':'+order[0]});note(`${CO(w1.co).name} earned ${ec.CR} Coins from ${pn(order[0])}'s victory.`,'company')}
 const r=post(list);e.status=r.err&&!r.dup?'error':'settled';e.res=order.slice()}
function econSettleT(t){const e=EC().t[t.id];if(!e||e.status!='open'||t.paidOut)return;const ec=eco(),list=[];t.placements.forEach((id,i)=>{const pz=ec.P8[i]||0;if(pz>0)list.push({o:'p',id,type:'prize',amt:pz,rid:t.id,key:'tp:'+t.id+':'+id})});
 const w1=e.ents.find(n=>n.id==t.champion);if(w1&&w1.co){list.push({o:'c',id:w1.co,type:'victory_reward',amt:ec.CR,rid:t.id,who:t.champion,key:'tv:'+t.id+':'+t.champion});note(`${CO(w1.co).name} earned ${ec.CR} Coins from ${pn(t.champion)}'s tournament victory.`,'company')}
 const r=post(list);if(!r.err||r.dup){e.status='settled';t.paidOut=true;save()}}
function econHook(rid,rc,t){if(!t)econSettle(rid,rc);else if(t.status=='done'&&t.placements&&t.econV==1)econSettleT(t)}
// ---- wagers on challenges
function pickWager(a,b){const m=Math.min(P(a).coins,P(b).coins),c=[0,0,10,20,30,50].filter(x=>x<=m*.4);return c[ri(c.length)]}
function mkChal(from,to,track,laps,reason,evt,of,wager){const s=S();
 if(!P(from)||!P(to))return'Racer not found.';if(from==to)return'A racer cannot challenge themselves.';
 if(!s.modes.includes('1v1'))return'1v1 challenges are disabled.';if(!TRACKS[track]||!lapOK(laps))return'Choose a valid track and 1\u201310 laps.';
 if(db.chal.some(c=>c.status=='pending'&&c.from==from&&c.to==to&&c.track==track&&+c.laps==+laps))return'Duplicate pending challenge for the same race.';
 if(db.chal.filter(c=>c.status=='pending'&&c.from==from).length>=s.maxPend)return pn(from)+' already has the maximum pending challenges.';
 if(db.chal.filter(c=>c.status=='pending'&&c.to==to).length>=s.maxPend)return pn(to)+' already has the maximum incoming challenges.';
 let w=wager;if(w===undefined||w===null){const o=of&&db.chal.find(x=>x.id==of);w=o?(o.wager||0):pickWager(from,to)}w=Math.max(0,Math.floor(+w||0));
 if(P(from).coins<w)return pn(from)+' cannot afford a '+w+'-Coin wager.';if(P(to).coins<w)return pn(to)+' cannot afford a '+w+'-Coin wager.';
 const c={id:uid(),from,to,mode:'1v1',track,laps:+laps,status:'pending',day:db.day,exp:db.day+s.expDays,reason:reason||'',evt:!!evt,of:of||null,wager:w};db.chal.push(c);P(from).lastCh=db.day;
 note(`RACE CHALLENGE: ${pn(from)} \u2192 ${pn(to)} (${TRACKS[track].name}, ${laps} laps${w?`, wager ${w} Coins each`:''})${reason?' \u2014 '+reason:''}`);save();return c}
function cityChallenge(a,b,track,laps,why,wager){const e=canChal(a,b);if(e)return e;return mkChal(a.id,b.id,track||Object.keys(TRACKS)[ri(3)],laps||3,why||'Challenged in the city',false,null,wager)}
// ---- race starts (every official start pays through econBegin)
function runChal(id,watchIt){const c=db.chal.find(q=>q.id==id);if(!c||c.status!='accepted')return'Not scheduled.';if(busy(c.from)||busy(c.to))return'A racer is currently racing.';
 const eo={kind:'1v1',wager:c.wager||0},e=econCheck([c.from,c.to],eo);if(e)return e;
 const kt=TR.id,kl=LAPS;setTrack(c.track,c.laps);const sim=newSim([c.from,c.to],Math.floor(Math.random()*2**31));initGrid(sim);
 if(watchIt){econAbandon();cur={mode:'live',tid:null,rid:'ch_'+c.id,sim,cd:3.99,paused:false,saved:false,econ:eo};tab='race';speed=1;render();return''}
 const o=econBegin({rid:'ch_'+c.id,sim,econ:eo});if(o!==true){setTrack(kt,kl);return o}
 while(!sim.done)stepSim(sim,1/30);finalizeRace('ch_'+c.id,sim,null,0,0,{trk:c.track,laps:c.laps});setTrack(kt,kl);return''}
function startQuick(){const m=cfg.mode,n=m=='1v1'?2:4,ids=cfg.ids.slice(0,n);
 if(ids.length<n||ids.some(x=>!x||!P(x)))return setupErr=`Select exactly ${n} racers.`,vSetup();
 if(new Set(ids).size!=n)return setupErr='Each racer can only be selected once.',vSetup();
 if(!TRACKS[cfg.track]||!lapOK(cfg.laps))return setupErr='Choose a valid track and 1\u201310 laps.',vSetup();
 const eo={kind:n==2?'1v1':'4p',wager:n==2?Math.max(0,Math.floor(+cfg.wager||0)):0},e=econCheck(ids,eo);if(e)return setupErr=e,vSetup();
 setupErr='';econAbandon();setTrack(cfg.track,+cfg.laps);const sim=newSim(ids,Math.floor(Math.random()*2**31));initGrid(sim);
 cur={mode:'live',tid:null,rid:'q'+uid(),sim,cd:3.99,paused:false,saved:false,econ:eo};tab='race';speed=1;render()}
function watch(tid,r,h){const t=db.tournaments.find(x=>x.id==tid),rid=tid+'-'+r+'-'+h;if(db.races[rid])return rep(rid);
 const e=(t.econV==1&&!EC().t[tid])?econCheckF(t.players,eco().F8):'';if(e)return alert(e);
 econAbandon();setTrack(t.track||'oval',t.laps||3);const sim=newSim(t.rounds[r].heats[h].ids,Math.floor(Math.random()*2**31));initGrid(sim);
 cur={mode:'live',tid,r,h,rid,sim,cd:3.99,paused:false,saved:false};tab='race';speed=1;render()}
function runFast(t,r,h){const e=econBeginT(t);if(e){t.blocked=e;return}const kt=TR.id,kl=LAPS;setTrack(t.track||'oval',t.laps||3);const sim=newSim(t.rounds[r].heats[h].ids,Math.floor(Math.random()*2**31));initGrid(sim);
 while(!sim.done)stepSim(sim,1/30);finalizeRace(t.id+'-'+r+'-'+h,sim,t,r,h);setTrack(kt,kl)}
function skip(id){const t=db.tournaments.find(x=>x.id==id),n=nextHeat(t);if(n){runFast(t,n[0],n[1]);if(t.blocked){alert(t.blocked);t.blocked=null}}vTour()}
function skipAll(id){const t=db.tournaments.find(x=>x.id==id);let n,g=0;while((n=nextHeat(t))&&g++<20){runFast(t,n[0],n[1]);if(t.blocked){alert(t.blocked);t.blocked=null;break}}vTour()}
function delT(id){if(confirm('Delete tournament?')){econRefundT(id,'tournament canceled');db.tournaments=db.tournaments.filter(t=>t.id!=id);save();vTour()}}
function finish(){const c=cur;if(c.saved)return;c.saved=true;const t=c.tid?db.tournaments.find(x=>x.id==c.tid):null;
 try{finalizeRace(c.rid,c.sim,t,c.r,c.h,{trk:TR.id,laps:LAPS});if(!db.races[c.rid])throw new Error('result not recorded')}catch(e){if(c.tid)econRefundT(c.tid,'technical failure');else econRefund(c.rid,'technical failure');alert('The race result could not be recorded. Entry fees were refunded.');return}
 showRes(db.races[c.rid])}
// ---- UI: wallet, company finances, lobby, result card
const TXN={starting_balance:'Starting balance',entry_fee:'Entrance fee',wager_stake:'Wager staked',wager_win:'Wager won',prize:'Prize',refund:'Refund',race_expense:'Race participation fee',victory_reward:'Victory reward'};
const rowTx=x=>`<tr><td>Day ${x.d}</td><td>${TXN[x.type]||x.type}${x.who&&x.o=='c'?' ('+esc(pn(x.who))+')':''}</td><td class="${x.amt>0?'win':''}">${x.amt>0?'+':''}${x.amt}</td><td>${x.next}</td></tr>`;
function walletCard(p){ensureWallet(p);const w=p.wst,tx=db.ledger.filter(x=>x.o=='p'&&x.oid==p.id).slice(-8).reverse();
 return`<div class="card"><h2>\u26c1 Wallet</h2><div class="big">${p.coins} Coins</div><div class="mu">Entrance fees paid (net of refunds): ${w.fees+w.staked-w.refunded} \u00b7 Wagers won: +${w.wagerWon} \u00b7 Wagers lost: \u2212${w.wagerLost} \u00b7 Race prizes earned: ${w.prizes}</div>
<table><tr><th>When</th><th>Transaction</th><th>Amount</th><th>Balance</th></tr>${tx.map(rowTx).join('')||'<tr><td colspan="4" class="mu">No transactions</td></tr>'}</table></div>`}
function finCard(c){ensureCW(c);const f=c.fin,tx=db.ledger.filter(x=>x.o=='c'&&x.oid==c.id).slice(-8).reverse(),inc=f.win,ex=f.hire+f.exp,ros=rosterOf(c.id);
 return`<div class="card"><h2>\u26c1 Company finances</h2><div class="big">${c.coins} Coins</div><div>Initial balance: ${c.start} \u00b7 Total income: ${inc} \u00b7 Total expenses: ${ex} \u00b7 Net ${c.coins-c.start>=0?'profit':'loss'}: <b class="${c.coins-c.start>=0?'win':''}">${c.coins-c.start>=0?'+':''}${c.coins-c.start}</b></div>
<div class="mu">Hiring payments: ${f.hire} (no hiring fee is defined) \u00b7 Race participation expenses: ${f.exp} (20 per funded race) \u00b7 Victory rewards: ${f.win} (200 per first-place win)</div>
<table><tr><th>Racer</th><th>Funded races</th><th>Wins</th><th>Expenses</th><th>Rewards</th><th>Net</th></tr>${ros.map(p=>{const b=f.by[p.id]||{funded:0,wins:0,exp:0,win:0};return`<tr><td>${esc(p.name)}</td><td>${b.funded}</td><td>${b.wins}</td><td>${b.exp}</td><td>${b.win}</td><td>${b.win-b.exp}</td></tr>`}).join('')||'<tr><td colspan="6" class="mu">No hired racers</td></tr>'}</table>
<h2>Recent transactions</h2><table><tr><th>When</th><th>Transaction</th><th>Amount</th><th>Balance</th></tr>${tx.map(rowTx).join('')||'<tr><td colspan="4" class="mu">None</td></tr>'}</table></div>`}
function lobbyHTML(kind,ids,wager){const ec=eco(),fee=kind=='1v1'?wager:kind=='4p'?ec.F4:ec.F8,pz=kind=='1v1'?(wager>0?`Winner takes the whole pool: ${2*wager} Coins`:'No wager \u2014 free race'):kind=='4p'?'1st: 60 \u00b7 2nd: 20 \u00b7 3rd: 0 \u00b7 4th: 0':'1st: 160 \u00b7 2nd: 80 \u00b7 3rd: 40 \u00b7 4th: 40 \u00b7 5th\u20138th: 0';
 return`<div class="card"><h2>\u26c1 Race lobby \u2014 ${kind=='1v1'?'1v1 Race':kind=='4p'?'Four-Racer Race':'Eight-Racer Tournament'}</h2><div>Participants: ${ids.filter(Boolean).length} \u00b7 ${kind=='1v1'?'Wager':'Entrance fee'}: <b>${fee} Coins each</b> \u00b7 ${pz}</div>
${kind=='1v1'?`<div class="row" style="margin:4px 0"><label>Wager (Coins each) <input type="text" id="cwager" size="5" value="${wager}" onchange="cfg.wager=Math.max(0,Math.floor(+this.value||0));render()"></label></div>`:''}
<table><tr><th>Racer</th><th>Coins</th><th>Can pay?</th><th>Company</th></tr>${ids.filter(Boolean).map(id=>{const p=P(id);if(!p)return'';ensureWallet(p);const co=employer(id);return`<tr><td>${esc(p.name)}</td><td>${p.coins}</td><td>${p.coins>=fee?'yes':'<b style="color:#ff6b6b">no</b>'}</td><td>${co?esc(co.name)+' pays '+ec.CF+(co.coins>=ec.CF?'':' (cannot afford \u2014 enters independently)'):'Independent'}</td></tr>`}).join('')}</table>
<div class="mu">Fees are charged only when the race officially starts. Cancelled or interrupted races refund everything.</div></div>`}
function setupEcon(){const v=$('#view');if(!v||!v.insertAdjacentHTML)return;cfg.wager=cfg.wager||0;const m=cfg.mode;v.insertAdjacentHTML('beforeend',m=='t8'?lobbyHTML('t8',TC.ids,0):lobbyHTML(m,cfg.ids,m=='1v1'?cfg.wager:0))}
function econResCard(rc){const tid=rc.mode=='tournament'?rc.id.split('-')[0]:null,rows=db.ledger.filter(x=>x.rid==rc.id||(tid&&x.rid==tid));if(!rows.length)return'';
 return`<div class="card wrap"><h2>\u26c1 Coin changes</h2><table><tr><th>Account</th><th>Transaction</th><th>Amount</th><th>Balance after</th></tr>${rows.map(x=>`<tr><td>${x.o=='c'?'\ud83c\udfe2 '+esc(CO(x.oid)?.name||'?'):esc(pn(x.oid))}</td><td>${TXN[x.type]||x.type}${x.who&&x.o=='c'?' ('+esc(pn(x.who))+')':''}</td><td class="${x.amt>0?'win':''}">${x.amt>0?'+':''}${x.amt}</td><td>${x.next}</td></tr>`).join('')}</table></div>`}
function showRes(rc){showRes0(rc);const el=$('#res');if(el)el.innerHTML+=econResCard(rc)}
function render(){nav();({city:vCity,players:vPlayers,garage:vGarage,setup:()=>{vSetup();setupEcon()},chal:vChal,comp:vComp,news:vNews,tour:vTour,race:vRace,board:vBoard})[tab]()}
// ---- start-up (last)
(function(){EC();db.players.forEach(ensureWallet);db.comps.forEach(ensureCW);db.tournaments.forEach(t=>{if(t.econV==null)t.econV=0});econRecover();save()})();
render();
</script></body></html>
